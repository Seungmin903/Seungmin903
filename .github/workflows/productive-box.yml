name: Productive box

on:
  workflow_dispatch:
  schedule:
    # 09:17 Asia/Seoul
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: productive-box
  cancel-in-progress: false

jobs:
  update-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check token configuration
        env:
          GH_TOKEN: ${{ secrets.PRODUCTIVE_BOX_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the PRODUCTIVE_BOX_TOKEN repository secret (classic PAT with gist and repo scopes)."
            exit 1
          fi
      - name: Update commit time statistics
        # maxam2017/productive-box, upstream used by techinpark/productive-box
        uses: maxam2017/productive-box@89f16a40b4a871f415f46b9245d048d28c288dc5
        env:
          GH_TOKEN: ${{ secrets.PRODUCTIVE_BOX_TOKEN }}
          GIST_ID: c387e78e83cf960f3a2d55a6ce2f5896
          TIMEZONE: Asia/Seoul
